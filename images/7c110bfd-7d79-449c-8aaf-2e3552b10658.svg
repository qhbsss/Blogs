@startuml

autonumber

user -> buy2: 立即购买
buy2 -> buy2: 订单渲染
user -> buy2: 创建订单
buy2 -> tp3: 获取订单号
buy2 -> tp3: 保存订单数据
tp3 -> tp3: 订单落库
buy2 -> tp3: 创建支付
tp3 -> alipay_or_pp: 创建外部支付
buy2 -> user: 跳转至支付页
user -> alipay_or_wx: 支付

@enduml

