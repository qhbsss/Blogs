@startuml

start

:调用服务端Deal;

if (是否抛异常) then (没抛异常)
:不阻断;
else
if (服务端是否抛NeedInterruptCreatingOrderException异常) then (是)
:阻断;
else
if (是否有优惠) then (没优惠)
:不阻断;
else 
if (判断客户端阻断规则) then (符合阻断场景)
:阻断;
else
:不阻断;
endif
endif
endif
endif

stop

@enduml

